name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same rule as the Makefile: an unrecorded request is a hard failure rather
  # than a silent call to the live CDMX service.
  VCR_RECORD_MODE: none

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # The same hooks a contributor runs on commit, over every file rather than
      # only the staged ones -- so `--no-verify` or an uninstalled hook still
      # gets caught here.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # One old-Python failure should not hide the state of the others.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv build
      # Catches the metadata problems PyPI rejects on upload -- when the release
      # workflow runs it is already too late to fix them.
      - run: uvx twine check --strict dist/*
