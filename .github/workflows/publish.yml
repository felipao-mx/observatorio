name: Publish

# Publishing is driven by GitHub Releases: tag a commit, publish the release,
# and this uploads the matching distributions to PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # PyPI refuses to replace a file once uploaded, so a version that does not
      # match the tag has to fail here rather than after the upload.
      - name: Check the tag matches the project version
        run: |
          version=$(uv version --short)
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Kept separate from the build job so the OIDC token is only available to a
    # job that does nothing but upload already-built files.
    environment:
      name: pypi
      url: https://pypi.org/p/observatorio
    permissions:
      # Trusted publishing: PyPI verifies this token instead of a stored API
      # key. Configure it once at https://pypi.org/manage/account/publishing/.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
