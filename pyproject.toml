[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observatorio"
version = "0.2.0"
description = "Live service status for Mexico City public transport (Metro, Metrobús, Trolebús, Tren Ligero, Cablebús)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "felipao-mx" }]
keywords = ["cdmx", "mexico-city", "metro", "metrobus", "transit", "open-data", "gtfs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
    "Natural Language :: Spanish",
]
dependencies = [
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
]

# PEP 735 group rather than an optional-dependency extra: these are for working
# on the library, not for consuming it, so they should not be installable as
# `pip install observatorio[dev]`. uv syncs this group by default.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-vcr>=1",
    "vcrpy>=7",
    "ruff>=0.16",
    "ty>=0.0.65",
    "pre-commit>=4",
]

[project.urls]
Homepage = "https://github.com/felipao-mx/observatorio"
Repository = "https://github.com/felipao-mx/observatorio"
Issues = "https://github.com/felipao-mx/observatorio/issues"
Findings = "https://github.com/felipao-mx/observatorio/blob/main/docs/FINDINGS.md"

[project.scripts]
observatorio = "observatorio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/observatorio"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "C4",        # comprehensions
    "RUF",       # ruff-specific
]

[tool.ruff.format]
# Ruff also formats Python blocks embedded in Markdown. The README's examples
# line up their trailing comments so each field is explained next to it, and the
# formatter collapses that alignment. Prose stays hand-formatted.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private parsing helpers on purpose -- that is where the
# logic worth testing lives.
"tests/*" = ["E501"]
